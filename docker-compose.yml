version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: visionx-postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-examguard_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-supersecretpassword}
      POSTGRES_DB: ${POSTGRES_DB:-examguard}
    ports:
      - "5435:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-examguard_user} -d ${POSTGRES_DB:-examguard}" ]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: visionx-redis
    restart: always
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    container_name: visionx-backend
    restart: always
    ports:
      - "8080:8000"
    environment:
      # Notice we connect using 'db' and 'redis' container hostnames inside the Docker network.
      DATABASE_URL: postgresql://${POSTGRES_USER:-examguard_user}:${POSTGRES_PASSWORD:-supersecretpassword}@db:5432/${POSTGRES_DB:-examguard}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-dummy_local_secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - "./input videos:/input videos"
    healthcheck:
      test: [ "CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')\" || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 3

  frontend:
    image: node:20-alpine
    container_name: visionx-frontend
    restart: always
    working_dir: /app
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    command: sh -c "rm -rf node_modules/.eslint* && npm install && npm run dev"
    ports:
      - "3000:3000"
    environment:
      # Browser-facing URLs must use localhost (because the browser is outside the docker network)
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
      NEXT_PUBLIC_VIDEO_STREAM_URL: http://localhost:5000/video_feed
      GROQ_API_KEY: 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
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  frontend_node_modules:
